<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>부서 · 사원관리</title>
  <link rel="stylesheet" href="/css/basic.css">
  <link rel="stylesheet" href="/css/component.css">
  <link rel="stylesheet" href="/css/app-shell.css">
  <link rel="stylesheet" href="/css/hr.css">
  <script src="/js/component.js" defer></script>
  <script src="/js/app-shell.js" defer></script>
</head>
<body data-shell-brand="👔 사원관리" data-shell-key="hr" data-shell-home="index.html" data-shell-active="dept" data-shell-nav='[{"href":"index.html","key":"emp","label":"사원 목록"},{"href":"depts.html","key":"dept","label":"부서"},{"href":"dashboard.html","key":"dashboard","label":"대시보드"}]'>
  <header data-app-header></header>

  <main class="app-main container container--wide">
    <div class="page-head">
      <div>
        <h1>부서</h1>
        <p>전체 9개 부서</p>
      </div>
      <button class="btn btn--primary" type="button" data-modal-open="dept-modal">+ 부서 추가</button>
    </div>

    <div class="table-wrap">
      <table class="table table--striped">
        <thead>
          <tr><th>코드</th><th>부서명</th><th>근무지</th><th>인원</th><th>평균 급여</th><th>관리</th></tr>
        </thead>
        <tbody>
          <tr><td>D1</td><td>인사관리부</td><td>서울</td><td>3명</td><td>2,606,000원</td><td class="row-actions"><a href="#">수정</a></td></tr>
          <tr><td>D2</td><td>회계관리부</td><td>서울</td><td>3명</td><td>2,280,000원</td><td class="row-actions"><a href="#">수정</a></td></tr>
          <tr><td>D3</td><td>마케팅부</td><td>서울</td><td>0명</td><td>-</td><td class="row-actions"><a href="#">수정</a></td></tr>
          <tr><td>D5</td><td>해외영업1부</td><td>일본</td><td>5명</td><td>2,752,000원</td><td class="row-actions"><a href="#">수정</a></td></tr>
          <tr><td>D6</td><td>해외영업2부</td><td>중국</td><td>2명</td><td>3,650,000원</td><td class="row-actions"><a href="#">수정</a></td></tr>
          <tr><td>D8</td><td>기술지원부</td><td>러시아</td><td>3명</td><td>2,328,000원</td><td class="row-actions"><a href="#">수정</a></td></tr>
          <tr><td>D9</td><td>총무부</td><td>서울</td><td>3명</td><td>5,900,000원</td><td class="row-actions"><a href="#">수정</a></td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer data-app-footer></footer>

  <!-- 부서 추가 모달 -->
  <div class="modal" id="dept-modal" data-modal hidden>
    <div class="modal__overlay" data-modal-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true" tabindex="-1" aria-labelledby="dept-modal-title" style="width: min(440px, 100%)">
      <button class="modal__close" type="button" data-modal-close aria-label="닫기">×</button>
      <h3 class="modal__title" id="dept-modal-title">부서 추가</h3>
      <form class="modal__body stack" style="--gap: var(--space-4)" data-dept-form>
        <div class="field">
          <label class="label" for="d-code">부서 코드 *</label>
          <input class="input" id="d-code" placeholder="D10" required>
        </div>
        <div class="field">
          <label class="label" for="d-name">부서명 *</label>
          <input class="input" id="d-name" placeholder="신사업개발부" required>
        </div>
        <div class="field">
          <label class="label" for="d-loc">근무지</label>
          <select class="select" id="d-loc">
            <option>서울</option><option>일본</option><option>중국</option><option>미국</option><option>러시아</option>
          </select>
        </div>
      </form>
      <div class="modal__footer">
        <button class="btn btn--secondary" type="button" data-modal-close>취소</button>
        <button class="btn btn--primary" type="button" id="dept-save">추가</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById("dept-save").addEventListener("click", function () {
        UI.modal.close("dept-modal");
        UI.toast("부서가 추가되었습니다. (프로토타입)", { type: "success" });
      });
    });
  </script>
</body>
</html>
