# Day 2 — src/main/resources/application.yml
#
# ── application 설정 파일이란? ─────────────────────────────────
# 스프링 부트는 기동할 때 classpath(주로 src/main/resources/) 에서
# "application" 이라는 이름의 설정 파일을 스스로 찾아 읽는다.
# 코드나 실행 옵션으로 파일명을 지정할 필요가 없다 — 관례가 곧 설정.
#
#   지원 확장자 : application.properties / application.yml / application.yaml
#   → 확장자에 관계없이 이름이 "application" 이면 읽어서 설정에 적용한다.
#
#   application.properties : key=value 한 줄에 하나 (전통적)
#   application.yml        : 계층 구조를 들여쓰기로 표현 (이 과정에서 사용)
#
# 같은 위치에 .properties 와 .yml 이 둘 다 있으면 스프링 부트는 둘 다 읽고,
# 같은 키가 겹치면 application.properties 값이 이긴다.
# → 실무에선 한 형식만 쓴다. (같은 폴더의 application.properties 는 형식 비교용)
#
# YAML 문법 규칙:
#   - 들여쓰기는 공백 2칸. 탭(Tab) 금지.
#   - "키: 값" 에서 콜론 뒤 공백 1칸.
#   - 목록 항목은 "- " 로 시작.
# ─────────────────────────────────────────────────────────────

server:
  port: 8080            # 포트 충돌 시 8090 등으로 변경

spring:
  application:
    name: hr-system     # 로그/모니터링에 표시될 앱 이름 (@Value 로 읽을 수 있음)

logging:
  level:
    org.springframework.web: INFO
    com.example.hr: DEBUG      # 우리 패키지는 자세히 (Day 3에서 이어서 다룸)
