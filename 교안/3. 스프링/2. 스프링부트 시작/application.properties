# Day 2 — src/main/resources/application.properties
#
# 위 application.yml 과 "똑같은 설정" 을 properties 형식으로 옮긴 것 — 형식 비교용.
# 실제 프로젝트에는 application.yml 하나만 두고, 이 파일은 참고로만 본다.
#
# ── 핵심 ──────────────────────────────────────────────────────
# 스프링 부트는 확장자에 관계없이 이름이 "application" 인 설정 파일을
# src/main/resources/ 에서 찾아 읽고 설정에 적용한다.
#   application.properties, application.yml, application.yaml 모두 인식.
# 같은 위치에 둘 다 있으면 둘 다 읽되, 같은 키는 이 파일(.properties)이 이긴다.
# ─────────────────────────────────────────────────────────────
#
# 형식 차이:
#   yml         server:
#                 port: 8080
#   properties  server.port=8080     ← 계층을 점(.)으로 이어 한 줄에 하나, 콜론 대신 =

server.port=8080

spring.application.name=hr-system

logging.level.org.springframework.web=INFO
logging.level.com.example.hr=DEBUG
