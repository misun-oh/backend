<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jimin_park · 임스타그램</title>
  <link rel="stylesheet" href="css/basic.css">
  <link rel="stylesheet" href="css/component.css">
  <link rel="stylesheet" href="css/app-shell.css">
  <link rel="stylesheet" href="css/instagram.css">
  <script src="js/component.js" defer></script>
</head>
<body>
  <!-- 공통 메뉴 — templates/instagram/_menu.html 참고 (Thymeleaf 전환 시 fragment 로) -->
  <header class="site-header">
    <div class="site-header__inner container container--wide">
      <a class="site-header__brand" href="index.html">📷 임스타그램</a>
      <nav class="site-nav hide-mobile" aria-label="주요 메뉴">
        <a href="index.html">홈</a>
        <a href="explore.html">탐색</a>
        <a href="profile.html" aria-current="page">내 프로필</a>
      </nav>
      <span class="spacer"></span>
      <button class="btn btn--ghost btn--sm" type="button" data-theme-toggle aria-label="다크 모드 전환">🌓</button>
      <a class="btn btn--primary btn--sm" href="index.html">로그인</a>
    </div>
  </header>

  <main class="app-main container">
    <div class="feed" style="max-width: 720px">
      <div class="pf-head">
        <span class="avatar">박</span>
        <div class="spacer">
          <div class="row" style="--gap: var(--space-3)">
            <h1 style="font-size: var(--text-xl)">jimin_park</h1>
            <button class="btn btn--secondary btn--sm" type="button" data-modal-open="edit-modal">프로필 편집</button>
          </div>
          <div class="pf-stats">
            <span><b>128</b> 게시물</span>
            <span><b>1,204</b> 팔로워</span>
            <span><b>312</b> 팔로잉</span>
          </div>
          <p style="font-size: var(--text-sm)"><b>박지민</b> · 해외영업1부<br>주말엔 등산 ⛰️ 사진은 취미</p>
        </div>
      </div>

      <div class="tabs" data-tabs>
        <div class="tabs__list" role="tablist" aria-label="프로필 탭">
          <button type="button" class="tabs__tab" role="tab" id="pt-posts" aria-controls="pp-posts" aria-selected="true">게시물</button>
          <button type="button" class="tabs__tab" role="tab" id="pt-saved" aria-controls="pp-saved" aria-selected="false">저장됨</button>
        </div>
        <div class="tabs__panel" role="tabpanel" id="pp-posts" aria-labelledby="pt-posts">
          <div class="photo-grid">
            <span class="photo"></span><span class="photo photo--c"></span><span class="photo photo--e"></span>
            <span class="photo photo--b"></span><span class="photo photo--d"></span><span class="photo photo--f"></span>
            <span class="photo photo--g"></span><span class="photo photo--h"></span><span class="photo"></span>
          </div>
        </div>
        <div class="tabs__panel" role="tabpanel" id="pp-saved" aria-labelledby="pt-saved" hidden>
          <div class="photo-grid">
            <span class="photo photo--h"></span><span class="photo photo--f"></span><span class="photo photo--b"></span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container container--wide row row--between">
      <p>📷 임스타그램 · 학습용 프로토타입</p>
      <span class="muted" style="font-size: var(--text-sm)">디자인 시스템: /css/basic.css</span>
    </div>
  </footer>

  <!-- 프로필 편집 모달 -->
  <div class="modal" id="edit-modal" data-modal hidden>
    <div class="modal__overlay" data-modal-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true" tabindex="-1" aria-labelledby="edit-modal-title" style="width: min(440px, 100%)">
      <button class="modal__close" type="button" data-modal-close aria-label="닫기">×</button>
      <h3 class="modal__title" id="edit-modal-title">프로필 편집</h3>
      <form class="modal__body stack" style="--gap: var(--space-4)" data-edit-form>
        <div class="field"><label class="label" for="e-name">이름</label><input class="input" id="e-name" value="박지민"></div>
        <div class="field"><label class="label" for="e-user">사용자 이름</label><input class="input" id="e-user" value="jimin_park"></div>
        <div class="field"><label class="label" for="e-bio">소개</label><textarea class="textarea" id="e-bio">주말엔 등산 ⛰️ 사진은 취미</textarea></div>
        <label class="switch">
          <input type="checkbox" checked>
          <span class="switch__track"><span class="switch__thumb"></span></span>
          <span class="switch__label">비공개 계정</span>
        </label>
      </form>
      <div class="modal__footer">
        <button class="btn btn--secondary" type="button" data-modal-close>취소</button>
        <button class="btn btn--primary" type="button" id="edit-save">저장</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById("edit-save").addEventListener("click", function () {
        UI.modal.close("edit-modal");
        UI.toast("프로필이 저장되었습니다.", { type: "success" });
      });
    });
  </script>
</body>
</html>
