<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · 사내도서관</title>
  <link rel="stylesheet" href="css/basic.css">
  <link rel="stylesheet" href="css/component.css">
  <link rel="stylesheet" href="css/app-shell.css">
  <link rel="stylesheet" href="css/book.css">
  <script src="js/component.js" defer></script>
</head>
<body>
  <!--
    로그인 화면 (Day 12 로그인과 권한 연결 지점)
    Thymeleaf 전환:
      <form th:action="@{/login}" method="post">  (CSRF hidden 은 Security 자동)
      name 은 Security 기본값 username / password
      <div class="alert alert--danger" th:if="${param.error}">아이디/비밀번호 확인</div>
      <div class="alert alert--info"   th:if="${param.logout}">로그아웃되었습니다</div>
  -->
  <main class="auth-wrap">
    <div class="auth-card stack" style="--gap: var(--space-5)">
      <div class="text-center stack" style="--gap: var(--space-1)">
        <p style="font-size: var(--text-2xl)">📚</p>
        <h1 style="font-size: var(--text-xl)">사내도서관</h1>
        <p class="muted" style="font-size: var(--text-sm)">사원 계정으로 로그인하세요.</p>
      </div>

      <form class="stack" style="--gap: var(--space-4)" action="/login" method="post" data-login-form>
        <div class="field">
          <label class="label" for="username">아이디</label>
          <input class="input" id="username" name="username" autocomplete="username" placeholder="사번 또는 이메일" required autofocus>
        </div>
        <div class="field">
          <label class="label" for="password">비밀번호</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <label class="check">
          <input type="checkbox" name="remember-me">
          <span>로그인 유지</span>
        </label>
        <button class="btn btn--primary btn--block" type="submit">로그인</button>
      </form>

      <p class="text-center muted" style="font-size: var(--text-sm)">
        <a href="index.html">← 도서 목록으로</a>
      </p>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.querySelector("[data-login-form]").addEventListener("submit", function (e) {
        e.preventDefault();
        location.href = "index.html";
      });
    });
  </script>
</body>
</html>
