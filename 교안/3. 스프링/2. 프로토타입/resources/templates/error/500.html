<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>500 · 서버 오류</title>
  <link rel="stylesheet" href="/css/basic.css">
  <link rel="stylesheet" href="/css/component.css">
</head>
<body>
  <!-- 500 전용: 서버 내부 오류 (스택트레이스·메시지는 사용자에게 노출하지 않는다) -->
  <main class="auth-wrap">
    <div class="empty-state" style="max-width: 420px">
      <p class="empty-state__icon" aria-hidden="true">🛠️</p>
      <p class="empty-state__title">서버에 문제가 발생했습니다 (500)</p>
      <p class="empty-state__desc">잠시 후 다시 시도해 주세요. 문제가 계속되면 관리자에게 문의하세요.</p>
      <a class="btn btn--primary btn--sm" href="/">처음으로</a>
    </div>
  </main>
</body>
</html>
