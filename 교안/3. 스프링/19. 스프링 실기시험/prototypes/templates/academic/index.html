<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학사관리 - 학생 목록</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1100px; margin: 40px auto; padding: 0 20px; color: #243047; }
    h1 { margin-bottom: 8px; }
    .muted { color: #68758a; }
    form { display: flex; gap: 8px; flex-wrap: wrap; margin: 24px 0; padding: 16px; background: #f3f6fa; }
    input, select, button { padding: 9px 10px; border: 1px solid #cbd5e1; border-radius: 4px; background: white; }
    button { background: #2457a6; color: white; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 13px 10px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    th { background: #edf2f7; }
    a { color: #2457a6; text-decoration: none; }
    .status { display: inline-block; padding: 4px 8px; border-radius: 12px; background: #dff5e5; color: #176b32; font-size: 13px; }
  </style>
</head>
<body>
  <h1>학사관리</h1>
  <p class="muted">학생 목록</p>

  <form method="get" action="/students">
    <input type="search" name="keyword" placeholder="이름 또는 이메일">
    <select name="departmentId">
      <option value="">전체 학과</option>
      <option value="CS">컴퓨터공학과</option>
      <option value="BUSINESS">경영학과</option>
      <option value="DESIGN">디자인학과</option>
    </select>
    <select name="status">
      <option value="">전체 상태</option>
      <option value="ENROLLED">재학</option>
      <option value="LEAVE">휴학</option>
      <option value="GRADUATED">졸업</option>
    </select>
    <button type="submit">검색</button>
  </form>

  <table>
    <thead>
      <tr><th>학번</th><th>이름</th><th>학과</th><th>학년</th><th>이메일</th><th>상태</th></tr>
    </thead>
    <tbody>
      <tr>
        <td><a href="student-detail.html">20240001</a></td><td>김학생</td><td>컴퓨터공학과</td><td>2</td><td>student@example.com</td><td><span class="status">재학</span></td>
      </tr>
      <tr>
        <td><a href="student-detail.html">20230015</a></td><td>이수강</td><td>경영학과</td><td>3</td><td>lee@example.com</td><td><span class="status">재학</span></td>
      </tr>
    </tbody>
  </table>
</body>
</html>
