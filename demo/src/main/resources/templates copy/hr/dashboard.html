        <div class="bar-row">
          <span class="bar-row__name">인사관리부</span>
          <div class="progress"><div class="progress__bar" style="width: 60%"></div></div>
          <span class="bar-row__count">3명</span>
        </div>
        <div class="bar-row">
          <span class="bar-row__name">회계관리부</span>
          <div class="progress"><div class="progress__bar" style="width: 60%"></div></div>

        <div class="bar-row">

          <div class="progress"><div class="progress__bar" style="width: 60%"></div></div>
          <span class="bar-row__count">3명</span>

        <div class="bar-row">
          <span class="bar-row__name">총무부</span>
          <div class="progress"><div class="progress__bar" style="width: 60%"></div></div>
          <span class="bar-row__count">3명</span>
        </div>
        <div class="bar-row">
          <span class="bar-row__name">해외영업2부</span>
          <div class="progress"><div class="progress__bar" style="width: 40%"></div></div>
          <span class="bar-row__count">2명</span>
        </div>

        <h3 class="mb-4">최근 입사자</h3>
        <table class="table">
          <thead><tr><th>이름</th><th>부서</th><th>입사일</th></tr></thead>
          <tbody>
            <tr><td><a href="emp-detail.html">한규원</a></td><td>미배정</td><td>2023-03-01</td></tr>

            <tr><td><a href="emp-detail.html">오미자</a></td><td>기술지원부</td><td>2021-11-28</td></tr>
