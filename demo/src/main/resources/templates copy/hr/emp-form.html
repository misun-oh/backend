<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사원 등록 · 사원관리</title>
  <link rel="stylesheet" href="/css/basic.css">
  <link rel="stylesheet" href="/css/component.css">
  <link rel="stylesheet" href="/css/app-shell.css">
  <link rel="stylesheet" href="/css/hr.css">
  <script src="/js/component.js" defer></script>
  <script src="/js/app-shell.js" defer></script>
</head>
<body data-shell-brand="👔 사원관리" data-shell-key="hr" data-shell-home="index.html" data-shell-active="emp" data-shell-nav='[{"href":"index.html","key":"emp","label":"사원 목록"},{"href":"depts.html","key":"dept","label":"부서"},{"href":"dashboard.html","key":"dashboard","label":"대시보드"}]'>
  <header data-app-header></header>

  <main class="app-main container">
    <nav class="breadcrumb mb-4" aria-label="현재 위치">
      <a href="index.html">사원 목록</a>
      <span aria-current="page">사원 등록</span>
    </nav>

    <div class="page-head">
      <div>
        <h1>사원 등록</h1>
        <p>새 사원의 기본 정보를 입력합니다. <span class="muted">* 표시는 필수 항목</span></p>
      </div>
    </div>

    <form class="card" style="padding: var(--space-6)" data-emp-form>
      <div class="form-grid">
        <div class="field">
          <label class="label" for="f-name">이름 *</label>
          <input class="input" id="f-name" name="name" placeholder="홍길동" required>
        </div>
        <div class="field">
          <label class="label" for="f-no">주민등록번호 *</label>
          <input class="input" id="f-no" name="empNo" placeholder="900101-1234567" required>
        </div>

        <div class="field field--error">
          <label class="label" for="f-email">이메일 *</label>
          <input class="input" id="f-email" name="email" value="hong.company.com">
          <p class="form-hint">올바른 이메일 형식이 아닙니다. (예: hong@company.com)</p>
        </div>
        <div class="field">
          <label class="label" for="f-phone">전화번호</label>
          <input class="input" id="f-phone" name="phone" placeholder="010-0000-0000">
        </div>

        <div class="field">
          <label class="label" for="f-dept">부서 *</label>
          <select class="select" id="f-dept" name="deptId" required>
            <option value="">선택하세요</option>
            <option value="D1">인사관리부</option>
            <option value="D2">회계관리부</option>
            <option value="D5" selected>해외영업1부</option>
            <option value="D8">기술지원부</option>
            <option value="D9">총무부</option>
          </select>
        </div>
        <div class="field">
          <label class="label" for="f-job">직급 *</label>
          <select class="select" id="f-job" name="jobCode" required>
            <option value="">선택하세요</option>
            <option value="J3">부장</option>
            <option value="J4">차장</option>
            <option value="J5">과장</option>
            <option value="J6">대리</option>
            <option value="J7" selected>사원</option>
          </select>
        </div>

        <div class="field">
          <label class="label" for="f-salary">기본급(월) *</label>
          <input class="input" id="f-salary" name="salary" type="number" min="0" step="10000" value="2500000" required>
        </div>
        <div class="field">
          <label class="label" for="f-hire">입사일 *</label>
          <input class="input" id="f-hire" name="hireDate" type="date" value="2026-09-01" required>
        </div>

        <div class="field">
          <label class="label" for="f-mgr">관리자</label>
          <select class="select" id="f-mgr" name="managerId">
            <option value="">없음</option>
            <option value="200">곽상혁 (대표)</option>
            <option value="205" selected>박지민 (해외영업1부 부장)</option>
            <option value="210">이광렬 (기술지원부 대리)</option>
          </select>
        </div>
        <div class="field">
          <span class="label">재직 여부</span>
          <label class="switch">
            <input type="checkbox" name="active" checked>
            <span class="switch__track"><span class="switch__thumb"></span></span>
            <span class="switch__label">재직</span>
          </label>
        </div>

        <div class="field field--full">
          <label class="label" for="f-memo">비고</label>
          <textarea class="textarea" id="f-memo" name="memo" placeholder="특이사항이 있으면 입력하세요."></textarea>
        </div>
      </div>

      <div class="row row--between mt-6">
        <a class="btn btn--ghost" href="index.html">← 목록으로</a>
        <div class="row" style="--gap: var(--space-2)">
          <a class="btn btn--secondary" href="index.html">취소</a>
          <button class="btn btn--primary" type="submit">저장</button>
        </div>
      </div>
    </form>
  </main>

  <footer data-app-footer></footer>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.querySelector("[data-emp-form]").addEventListener("submit", function (e) {
        e.preventDefault();  // 프로토타입: 실제 저장 대신 안내만
        UI.toast("저장되었습니다. (프로토타입)", { type: "success" });
        setTimeout(function () { location.href = "index.html"; }, 1200);
      });
    });
  </script>
</body>
</html>
