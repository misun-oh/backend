<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>피드 · 임스타그램</title>
  <link rel="stylesheet" href="/css/basic.css">
  <link rel="stylesheet" href="/css/component.css">
  <link rel="stylesheet" href="/css/app-shell.css">
  <link rel="stylesheet" href="/css/instagram.css">
  <script src="/js/component.js" defer></script>
  <script src="/js/app-shell.js" defer></script>
</head>
<body data-shell-brand="📷 임스타그램" data-shell-key="imstagram" data-shell-home="index.html"
      data-shell-active="home"
      data-shell-nav='[{"href":"index.html","key":"home","label":"홈"},{"href":"explore.html","key":"explore","label":"탐색"},{"href":"profile.html","key":"profile","label":"내 프로필"}]'>
  <header data-app-header></header>

  <main class="app-main container">
    <div class="feed">
      <!-- 스토리 -->
      <div class="stories">
        <div class="story"><span class="avatar">나</span><span class="story__name">내 스토리</span></div>
        <div class="story"><span class="avatar">박</span><span class="story__name">jimin_park</span></div>
        <div class="story"><span class="avatar">염</span><span class="story__name">sw.yeom</span></div>
        <div class="story"><span class="avatar">이</span><span class="story__name">gr.lee</span></div>
        <div class="story"><span class="avatar">전</span><span class="story__name">taesung</span></div>
        <div class="story"><span class="avatar">한</span><span class="story__name">gyuwon</span></div>
      </div>

      <!-- 게시물 1 -->
      <article class="post">
        <div class="post__head">
          <span class="avatar avatar--sm">박</span>
          <span class="post__user">jimin_park</span>
          <button class="post__more" type="button" aria-label="더보기">⋯</button>
        </div>
        <div class="carousel" data-carousel data-loop>
          <div class="carousel__viewport">
            <ul class="carousel__track">
              <li class="carousel__slide"><div class="photo"></div></li>
              <li class="carousel__slide"><div class="photo photo--c"></div></li>
            </ul>
          </div>
          <button type="button" class="carousel__arrow carousel__arrow--prev" aria-label="이전">‹</button>
          <button type="button" class="carousel__arrow carousel__arrow--next" aria-label="다음">›</button>
          <div class="carousel__dots" aria-label="사진 선택"></div>
        </div>
        <div class="post__actions">
          <button class="icon-btn like" type="button" aria-pressed="false" aria-label="좋아요">♡</button>
          <button class="icon-btn" type="button" aria-label="댓글">💬</button>
          <button class="icon-btn save" type="button" aria-pressed="false" aria-label="저장">🔖</button>
        </div>
        <div class="post__body">
          <p class="post__likes" data-likes>좋아요 42개</p>
          <p class="post__caption"><b>jimin_park</b> 점심 산책 겸 회사 옥상. 날씨 미쳤다 ☀️</p>
          <p class="post__cmts">댓글 8개 모두 보기</p>
          <p class="post__cmts"><b>sw.yeom</b> 여기 어디예요?? 저도 갈래요</p>
          <p class="post__time">2시간 전</p>
        </div>
        <div class="post__addcmt">
          <input type="text" placeholder="댓글 달기..." aria-label="댓글">
          <button class="btn btn--ghost btn--sm" type="button" data-post-cmt>게시</button>
        </div>
      </article>

      <!-- 게시물 2 -->
      <article class="post">
        <div class="post__head">
          <span class="avatar avatar--sm">전</span>
          <span class="post__user">taesung</span>
          <button class="post__more" type="button" aria-label="더보기">⋯</button>
        </div>
        <div class="photo photo--e"></div>
        <div class="post__actions">
          <button class="icon-btn like" type="button" aria-pressed="true" aria-label="좋아요">♥</button>
          <button class="icon-btn" type="button" aria-label="댓글">💬</button>
          <button class="icon-btn save" type="button" aria-pressed="false" aria-label="저장">🔖</button>
        </div>
        <div class="post__body">
          <p class="post__likes" data-likes>좋아요 127개</p>
          <p class="post__caption"><b>taesung</b> 사내 동아리 첫 모임 🎸 다음 주 공연 준비 화이팅</p>
          <p class="post__cmts">댓글 23개 모두 보기</p>
          <p class="post__time">어제</p>
        </div>
        <div class="post__addcmt">
          <input type="text" placeholder="댓글 달기..." aria-label="댓글">
          <button class="btn btn--ghost btn--sm" type="button" data-post-cmt>게시</button>
        </div>
      </article>
    </div>
  </main>

  <footer data-app-footer></footer>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // 좋아요 토글 (하트 채우기 + 카운트)
      document.querySelectorAll(".icon-btn.like").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var on = btn.getAttribute("aria-pressed") === "true";
          btn.setAttribute("aria-pressed", String(!on));
          btn.textContent = on ? "♡" : "♥";
          var likesEl = btn.closest(".post").querySelector("[data-likes]");
          var n = parseInt(likesEl.textContent.replace(/\D/g, ""), 10) || 0;
          likesEl.textContent = "좋아요 " + (on ? n - 1 : n + 1) + "개";
        });
      });
      // 저장 토글
      document.querySelectorAll(".icon-btn.save").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var on = btn.getAttribute("aria-pressed") === "true";
          btn.setAttribute("aria-pressed", String(!on));
          if (window.UI) UI.toast(on ? "저장을 취소했습니다." : "저장했습니다.");
        });
      });
      // 댓글 게시
      document.querySelectorAll("[data-post-cmt]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var input = btn.previousElementSibling;
          if (input.value.trim()) { input.value = ""; if (window.UI) UI.toast("댓글을 게시했습니다."); }
        });
      });
    });
  </script>
</body>
</html>
